<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESP32 Smart Remote</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>ESP32 Smart Remote</h1>
        <p id="device">接続中...</p>
      </header>

      <section>
        <h2>送信</h2>
        <label>
          Protocol
          <select id="protocol">
            <option>NEC</option>
            <option>SONY</option>
            <option>PANASONIC</option>
          </select>
        </label>
        <label>
          Value
          <input id="value" placeholder="0x20DF10EF" />
        </label>
        <label>
          Bits
          <input id="bits" type="number" value="32" min="1" max="64" />
        </label>
        <button id="send">送信</button>
        <pre id="result">{}</pre>
      </section>

      <section>
        <h2>最後に受信した信号</h2>
        <pre id="last">{}</pre>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
